<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spendory – Simple Private Finance Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="description" content="Simple private finance tracker. No signup. No ads. Your data stays on your device." />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="finance tracker, expense tracker, budget, privacy" />
    <meta name="author" content="Spendory" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Spendory – Simple Private Finance Tracker" />
    <meta property="og:description" content="Track your money privately. No signup. No cloud. No ads." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spendory.app" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spendory – Simple Private Finance Tracker" />
    <meta name="twitter:description" content="Track your money privately. No signup. No cloud. No ads." />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:image" content="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spendory" />
  </head>
  <body>
    <script>
      if (typeof Promise.withResolvers === 'undefined') {
        Promise.withResolvers = function() {
          var resolve, reject;
          var promise = new Promise(function(res, rej) { resolve = res; reject = rej; });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }
      if (typeof structuredClone === 'undefined') {
        structuredClone = function(obj) { return JSON.parse(JSON.stringify(obj)); };
      }
    </script>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('spendory-theme-v1');
          var theme = stored === 'light' || stored === 'dark' ? stored :
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.setProperty('--bg-primary', '#000000');
            root.style.setProperty('--bg-secondary', '#0A0A0A');
            root.style.setProperty('--bg-tertiary', '#111111');
            root.style.setProperty('--app-bg', '#000000');
            root.style.setProperty('--card-bg', '#111111');
            root.style.setProperty('--brand-primary', '#14b8a6');
            root.style.setProperty('--brand-secondary', '#0d9488');
            root.style.setProperty('--text-primary', '#FFFFFF');
            root.style.setProperty('--primary-text', '#E6F1EC');
            root.style.setProperty('--text-paragraph', '#71717A');
            root.style.setProperty('--text-muted', '#52525B');
            root.style.setProperty('--muted-text', '#6F7F79');
            root.style.setProperty('--border-subtle', '#1F1F23');
            root.style.setProperty('--default-border', '#1F1F23');
            root.style.setProperty('--danger-bg', '#450A0A');
            root.style.setProperty('--danger-text', '#FCA5A5');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.setProperty('--bg-primary', '#F8FAFC');
            root.style.setProperty('--bg-secondary', '#F1F5F9');
            root.style.setProperty('--bg-tertiary', '#FFFFFF');
            root.style.setProperty('--app-bg', '#F8FAFC');
            root.style.setProperty('--card-bg', '#FFFFFF');
            root.style.setProperty('--brand-primary', '#059669');
            root.style.setProperty('--brand-secondary', '#065f46');
            root.style.setProperty('--text-primary', '#0F172A');
            root.style.setProperty('--primary-text', '#0F172A');
            root.style.setProperty('--text-paragraph', '#475569');
            root.style.setProperty('--text-muted', '#64748B');
            root.style.setProperty('--muted-text', '#64748B');
            root.style.setProperty('--border-subtle', '#E2E8F0');
            root.style.setProperty('--default-border', '#E2E8F0');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
