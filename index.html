<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Spendory – Simple Private Finance Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="description" content="Simple private finance tracker. No signup. No ads. Your data stays on your device." />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="finance tracker, expense tracker, budget, privacy" />
    <meta name="author" content="Spendory" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Spendory – Simple Private Finance Tracker" />
    <meta property="og:description" content="Track your money privately. No signup. No cloud. No ads." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spendory.app" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spendory – Simple Private Finance Tracker" />
    <meta name="twitter:description" content="Track your money privately. No signup. No cloud. No ads." />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:image" content="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spendory" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('spendory-theme-v1');
          var theme = stored === 'light' || stored === 'dark' ? stored :
            (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.setProperty('--app-bg', '#0B0F0E');
            document.documentElement.style.setProperty('--card-bg', '#1A2321');
            document.documentElement.style.setProperty('--brand-primary', '#14b8a6');
            document.documentElement.style.setProperty('--primary-text', '#E6F1EC');
            document.documentElement.style.setProperty('--muted-text', '#6F7F79');
            document.documentElement.style.setProperty('--default-border', '#1F2A27');
          } else {
            document.documentElement.style.setProperty('--app-bg', '#F8FAFC');
            document.documentElement.style.setProperty('--card-bg', '#FFFFFF');
            document.documentElement.style.setProperty('--brand-primary', '#059669');
            document.documentElement.style.setProperty('--primary-text', '#0F172A');
            document.documentElement.style.setProperty('--muted-text', '#64748B');
            document.documentElement.style.setProperty('--default-border', '#E2E8F0');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
